on:
  pull_request:
    paths:
      - 'inc/**/*.php'
      - 'admin/**/*.php'
      - 'assets/src/blocks/**/*.php'
      - 'bin/hook-check/balance.php'
      - 'bin/hook-check/shared.php'
      - 'bin/hook-check/coverage.php'

name: wp-dam hook integrity

permissions:
  contents: read

jobs:
  checkHooks:
    name: Check rtgodam_before/after_attachment_lookup hook integrity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none
    - name: Run hook integrity check
      run: php bin/hook-check/balance.php check
    - name: Run attachment-access coverage check
      if: always()
      run: php bin/hook-check/coverage.php check
