on:
  pull_request:
    branches:
      - develop
      - main

name: PHP Syntax Check

permissions:
  contents: read

jobs:
  runPHPSyntaxCheck:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the plugin's "Requires PHP" (godam.php, readme.txt). PHP 8-only
        # syntax (constructor promotion, match, ?->, named arguments, enums)
        # is a parse error there, and a parse error in any loaded file takes
        # the whole site down on the next auto-update. 8.5 is the newest PHP,
        # to catch syntax that newer releases removed.
        php: [ '7.4', '8.5' ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # `php -l` only parses each file, so no Composer install is needed and
      # the dev-tool PHP pins in composer.lock don't apply. Skips files that
      # never ship or run on a site: tests/, bin/, and installed dependencies.
      - name: Lint PHP files
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              status=1
              line=$(printf '%s\n' "$output" | sed -n 's/.* on line \([0-9][0-9]*\).*/\1/p' | head -n 1 || true)
              message=$(printf '%s\n' "$output" | grep -m 1 -i 'error' || true)
              echo "::error file=${file#./},line=${line:-1}::PHP ${{ matrix.php }}: ${message}"
            fi
          done < <(find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './tests/*' \
            -not -path './bin/*' \
            -print0)
          exit $status
