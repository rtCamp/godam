name: Publish Plugin to WordPress.org
on:
  push:
    tags:
      - '*'
    branches:
      - develop

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Release tags must point at a commit that is already on main, so nothing
      # reaches WordPress.org from a feature branch or an old commit. A tag does
      # not record the branch it was made on, so we check main's history instead.
      # Dry tags and develop pushes are dry runs and are not checked.
      - name: Check the tag is on main
        if: github.ref_type == 'tag' && !startsWith(github.ref_name, 'dry')
        shell: bash
        run: |
          # The checkout is shallow; fetch full history so main's ancestry is known.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin main
          else
            git fetch --no-tags origin main
          fi
          if git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" FETCH_HEAD; then
            echo "Tag ${GITHUB_REF_NAME} points at a commit on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Tag a commit on main to release."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies & build assets
        shell: bash
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run build:prod

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          generate-zip: 'true'
          dry-run: ${{ startsWith(github.ref, 'refs/tags/dry') || github.ref == 'refs/heads/develop' }}
        env:
          SLUG: 'godam'
          ASSETS_DIR: 'wp-assets'
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: '${{ github.ref_name }}'

      - name: Repack Artifact
        shell: bash
        run: |
          # Extract the plugin ZIP to a temporary directory
          mkdir -p "${{ runner.temp }}/plugin-extract"
          unzip -q "${{ steps.deploy.outputs.zip-path }}" -d "${{ runner.temp }}/plugin-extract"
          
          # Create a properly structured ZIP for WordPress installation
          cd "${{ runner.temp }}/plugin-extract"
          zip -r -q "${{ runner.temp }}/godam.zip" .
          
          # Move the new ZIP to the workspace root for release upload
          mv "${{ runner.temp }}/godam.zip" "${{ github.workspace }}/godam.zip"

      - name: Upload Test Artifact
        if: startsWith(github.ref, 'refs/tags/dry') || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: godam
          path: '${{ runner.temp }}/plugin-extract/'

      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/dry') == false && github.ref != 'refs/heads/develop'
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: |
            '${{ github.workspace }}/godam.zip'
          token: '${{ github.token }}'
          tag_name: ${{ github.ref_name }}
          draft: true
